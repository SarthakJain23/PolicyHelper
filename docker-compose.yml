services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: policyhelper_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-policyuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-policypass123}
      POSTGRES_DB: ${POSTGRES_DB:-policyhelper_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-policyuser} -d ${POSTGRES_DB:-policyhelper_db}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
